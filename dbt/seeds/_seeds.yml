# _seeds.yml: static lookup tables loaded with `dbt seed` (stored in the silver schema)
# Reference: https://docs.getdbt.com/docs/build/seeds
version: 2

seeds:
  - name: country_codes
    description: "Lookup: all 249 ISO 3166-1 countries (alpha-2, alpha-3, name). Static reference data, so new countries in the source still resolve."
    config:
      column_types:
        country_code: string
        country_code_iso3: string
        country_name: string
    columns:
      - name: country_code
        description: "ISO 3166-1 alpha-2 code (primary key), e.g. DE."
        data_tests: [unique, not_null]
      - name: country_code_iso3
        description: "ISO 3166-1 alpha-3 code, e.g. DEU."
      - name: country_name
        description: "Common English country name."

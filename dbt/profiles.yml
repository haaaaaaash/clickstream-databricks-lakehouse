# profiles.yml: dbt -> Databricks SQL warehouse, logged in as the service principal sp-clickstream
# No secrets in this file: everything comes from environment variables (.env).
# dbt finds this file through DBT_PROFILES_DIR=dbt (in .env).
# References:
#   dbt-databricks setup: https://docs.getdbt.com/docs/core/connect-data-platform/databricks-setup
#   Entra ID service principal (OAuth M2M): https://learn.microsoft.com/azure/databricks/integrations/configure-oauth-dbt
clickstream_lakehouse:
  target: dev
  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DATABRICKS_WORKSPACE_URL') | replace('https://', '') }}"   # host name only
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"                            # SQL warehouse clickstream-wh
      catalog: "{{ env_var('DATABRICKS_CATALOG') }}"
      schema: silver                    # default schema; gold and test_failures set in dbt_project.yml
      auth_type: oauth                  # machine-to-machine login with the Entra ID app id + secret
      # azure_*: the adapter's names for an Entra ID service principal (plain client_id is for Databricks-managed ones)
      azure_client_id:     "{{ env_var('DATABRICKS_SP_CLIENT_ID') }}"
      azure_client_secret: "{{ env_var('DATABRICKS_SP_CLIENT_SECRET') }}"
      threads: 4
